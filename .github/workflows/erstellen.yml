name: Beiträge erstellen

on:
  schedule:
    - cron: "0 19 * * 3" # jeden Mittwoch 19:00 UTC (20:00 / 21:00 deutscher Zeit): Vorrat für die nächste Woche
  workflow_dispatch:
    inputs:
      anzahl:
        description: "Wie viele Beiträge (Zahl) oder 'auffuellen' = Vorrat auf 28 auffüllen"
        type: string
        default: "auffuellen"
      typ:
        description: "Art des Beitrags"
        type: choice
        default: auto
        options: [auto, geschichte, saetze]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: erstellen
  cancel-in-progress: false

env:
  VORRAT: 28 # 4 Beiträge pro Tag, 7 Tage

jobs:
  erstellen:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Bedarf ermitteln
        id: bedarf
        env:
          GH_TOKEN: ${{ github.token }}
          ANZAHL: ${{ inputs.anzahl || 'auffuellen' }}
        run: |
          OFFEN=$(gh pr list --state open --search "Freigabe in:title" --limit 200 --json number --jq length)
          WARTEND=$(node -e "import('./src/konfig.js').then(k=>console.log(k.ladePosts().filter(p=>!p.veroeffentlicht).length))")
          if [ "$ANZAHL" = "auffuellen" ]; then
            N=$((VORRAT - OFFEN - WARTEND)); [ "$N" -lt 0 ] && N=0
          else
            N=$ANZAHL
          fi
          echo "Offene Freigaben: $OFFEN, freigegeben und noch nicht gepostet: $WARTEND, zu erzeugen: $N"
          echo "n=$N" >> "$GITHUB_OUTPUT"

      - name: Beiträge erzeugen und vorlegen
        if: steps.bedarf.outputs.n != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TYP: ${{ inputs.typ || 'auto' }}
          N: ${{ steps.bedarf.outputs.n }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          FREIGABE=$(node -p "require('./config.json').freigabe")
          : > /tmp/themen.txt
          FERTIG=0; FEHLER=0

          for i in $(seq 1 "$N"); do
            echo "::group::Beitrag $i von $N"
            git fetch -q origin main
            git checkout -q --detach origin/main
            : > /tmp/ausgabe.txt
            if ! GITHUB_OUTPUT=/tmp/ausgabe.txt node src/erstellen.js --typ "$TYP" --anzahl 1 --versatz "$i" --themendatei /tmp/themen.txt; then
              FEHLER=$((FEHLER + 1))
              git clean -fdq posts
              echo "::endgroup::"
              continue
            fi
            ID=$(sed -n 's/^ids=//p' /tmp/ausgabe.txt)

            if [ "$FREIGABE" != "true" ]; then
              git add "posts/$ID"
              git commit -q -m "Neuer Beitrag: $ID"
              git push -q origin HEAD:main
            else
              ZWEIG="post/$ID"
              git checkout -q -b "$ZWEIG"
              git add "posts/$ID"
              git commit -q -m "Neuer Beitrag: $ID"
              git push -q origin "$ZWEIG"
              node src/freigabetext.js "$ID" "$ZWEIG" > /tmp/pr.md
              gh pr create --base main --head "$ZWEIG" --title "Freigabe: $(node -p "require('./posts/$ID/post.json').thema.trim()")" --body-file /tmp/pr.md \
                --assignee "$GITHUB_REPOSITORY_OWNER" --reviewer "$GITHUB_REPOSITORY_OWNER"
            fi
            FERTIG=$((FERTIG + 1))
            echo "::endgroup::"
          done

          echo "Fertig: $FERTIG, fehlgeschlagen: $FEHLER"
          [ "$FERTIG" -gt 0 ] || exit 1
