name: Taktgeber

# GitHub lässt geplante Läufe (cron) für dieses Repository aus. Deshalb läuft hier ein
# Dauerlauf: Er prüft alle 15 Minuten, ob laut config.json ("postzeiten", "maxProTag") ein
# Beitrag fällig ist, und startet sich nach gut fünf Stunden selbst neu.
# Außerdem füllt er den Vorrat auf: Liegen weniger als MINDESTVORRAT Beiträge bereit
# (offene Freigaben plus freigegebene, noch nicht gepostete), startet er "Beiträge erstellen".
# Höchstens einmal je Lauf, damit ein strenges Lektorat keine Endlosschleife auslöst.
# Einmalig von Hand starten: gh workflow run taktgeber.yml
# Stoppen: gh workflow disable taktgeber.yml

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *" # Ersatzstart, falls die Kette einmal abreißt

permissions:
  contents: write
  actions: write
  pull-requests: read

concurrency:
  group: taktgeber
  cancel-in-progress: false

jobs:
  takt:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Alle 15 Minuten prüfen und fällige Beiträge posten
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          MINDESTVORRAT: 9 # drei Tage à drei Beiträge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ende=$(( $(date +%s) + 5*3600 + 30*60 ))
          aufgefuellt=0
          while [ "$(date +%s)" -lt "$ende" ]; do
            git pull -q --rebase origin main || echo "Pull fehlgeschlagen, nächster Versuch in 15 Minuten"
            node src/posten.js || echo "Posten fehlgeschlagen, nächster Versuch in 15 Minuten"
            git add posts
            if ! git diff --cached --quiet; then
              git commit -q -m "Veröffentlicht"
              git pull -q --rebase origin main && git push -q origin HEAD:main
            fi
            if [ "$aufgefuellt" -eq 0 ]; then
              OFFEN=$(gh pr list --state open --search "Freigabe in:title" --limit 200 --json number --jq length || echo 99)
              WARTEND=$(node -e "import('./src/konfig.js').then(k=>console.log(k.ladePosts().filter(p=>!p.veroeffentlicht).length))" || echo 99)
              LAEUFT=$(gh run list --workflow erstellen.yml --limit 5 --json status --jq '[.[]|select(.status!="completed")]|length' || echo 1)
              echo "Vorrat: $OFFEN offene Freigaben, $WARTEND freigegeben und ungepostet, Erzeugung läuft: $LAEUFT"
              if [ $((OFFEN + WARTEND)) -lt "$MINDESTVORRAT" ] && [ "$LAEUFT" -eq 0 ]; then
                gh workflow run erstellen.yml --ref main -f anzahl=auffuellen && aufgefuellt=1 && echo "Vorrat knapp: Beiträge erstellen gestartet"
              fi
            fi
            sleep 900
          done

      - name: Nächsten Taktgeber starten
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run taktgeber.yml --ref main
