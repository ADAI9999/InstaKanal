name: Post veröffentlichen

on:
  schedule:
    - cron: "0 17 * * *" # täglich 17:00 UTC (18:00 / 19:00 deutscher Zeit)
  workflow_dispatch:
    inputs:
      probe:
        description: "Nur prüfen, nichts veröffentlichen"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: posten
  cancel-in-progress: false

jobs:
  posten:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Veröffentlichen
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PROBE: ${{ inputs.probe && '--probe' || '' }}
        run: node src/posten.js $PROBE

      - name: Als veröffentlicht vermerken
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Veröffentlicht"
          git pull --rebase origin main
          git push origin HEAD:main
