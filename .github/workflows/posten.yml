name: Post veröffentlichen

on:
  schedule:
    # Vier Beiträge pro Tag. Zeiten in UTC; deutsche Zeit = +1 Stunde (Winter) bzw. +2 Stunden (Sommer).
    - cron: "15 6 * * *" # 07:15
    - cron: "15 11 * * *" # 12:15
    - cron: "15 16 * * *" # 17:15
    - cron: "15 19 * * *" # 20:15
  workflow_dispatch:
    inputs:
      probe:
        description: "Nur prüfen, nichts veröffentlichen"
        type: boolean
        default: false
      id:
        description: "Bestimmten Beitrag posten (Teil der ID, z. B. beethoven); leer = ältester"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: posten
  cancel-in-progress: false

jobs:
  posten:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Veröffentlichen
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PROBE: ${{ inputs.probe && '--probe' || '' }}
          WUNSCH: ${{ inputs.id || '' }}
        run: node src/posten.js $PROBE ${WUNSCH:+--id "$WUNSCH"}

      - name: Als veröffentlicht vermerken
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Veröffentlicht"
          git pull --rebase origin main
          git push origin HEAD:main
