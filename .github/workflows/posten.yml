name: Post veröffentlichen

on:
  schedule:
    # Alle 20 Minuten von 05:05 bis 20:45 UTC (deutsche Winterzeit 06:05 bis 21:45). Ob ein Beitrag fällig ist, entscheidet src/posten.js
    # anhand von "postzeiten" in config.json (deutsche Zeit). So holt der nächste Lauf einen
    # Termin nach, den GitHub ausgelassen hat.
    - cron: "5,25,45 5-20 * * *"
  workflow_dispatch:
    inputs:
      probe:
        description: "Nur prüfen, nichts veröffentlichen"
        type: boolean
        default: false
      id:
        description: "Bestimmten Beitrag posten (Teil der ID, z. B. beethoven); leer = ältester"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: posten
  cancel-in-progress: false

jobs:
  posten:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Veröffentlichen
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PROBE: ${{ inputs.probe && '--probe' || '' }}
          WUNSCH: ${{ inputs.id || '' }}
        run: node src/posten.js $PROBE ${WUNSCH:+--id "$WUNSCH"}

      - name: Als veröffentlicht vermerken
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Veröffentlicht"
          git pull --rebase origin main
          git push origin HEAD:main
